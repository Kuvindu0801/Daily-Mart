<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>DailyMart POS - Supermarket Point of Sale</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" href="assets/img/icons8-supermarket-16.png">

</head>

<body>
    <div class="container">
        <div class="header">
            <i class="fa-solid fa-cart-shopping" style="color: #11f401;"></i>
            <h1>DailyMart POS</h1>
            <p>Supermarket Point of Sale System - Manage Grocery Sales Efficiently</p>
        </div>
        <div class="products-section">
            <h2 class="section-title">Products</h2>
            <div class="products-grid" id="productsGrid">
                <div class="grid-items">1</div>
                <div class="grid-items">2</div>
                <div class="grid-items">3</div>
                <div class="grid-items">4</div>
                <div class="grid-items">5</div>
                <div class="grid-items">6</div>
                <div class="grid-items">7</div>
                <div class="grid-items">8</div>
            </div>
        </div>

        <div class="cart-section">
            <h2 class="section-title">Shopping Cart</h2>
            <div class="cart-items" id="cartItems"></div>
            <div class="summary" id="summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">Rs.0.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax (5%):</span>
                    <span id="tax">Rs.0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">Rs.0.00</span>
                </div>
            </div>
            <button class="checkout-btn" onclick="checkout()">Complete Order 💳</button>
        </div>
        <!-- Managemet section -->
        <div class="management-section">
            <div class="tabs">
                <button class="tab-btn active" onclick="">Customers</button>
                <button class="tab-btn" onclick="">Products</button>
                <button class="tab-btn" onclick="">Orders</button>
            </div>
            <div id="customers" class="tab-content active">
                <h3>Customer Management</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="customerName" placeholder="Enter customer name">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="customerPhone" placeholder="Enter phone number">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addCustomer()">Add Customer</button>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="customersTable"></tbody>
                </table>
            </div>
            
            <div id="orders" class="tab-content">
                <h3>Order History</h3>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Customer</th>
                            <th>Total</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable"></tbody>
                </table>
            </div>
        </div>








        </div>
        <script src="assets/js/app.js"></script>
</body>

</html>
